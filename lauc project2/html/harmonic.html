<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonic Analysis Calculator</title>
<style>
  :root {
    --primary: #ff6b35;
    --primary-hover: #e85a24;
    --primary-light: #fff0ea;
    --secondary: #004e64;
    --bg: #fdfaf7;
    --card-bg: #ffffff;
    --text: #2b2d42;
    --text-muted: #6c757d;
    --border: #e9ecef;
    --success-bg: #e8f5e9;
    --success-border: #2e7d32;
  }

  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    padding: 30px 15px; 
    background: var(--bg); 
    color: var(--text);
    line-height: 1.5;
  }

  .container { 
    max-width: 1150px; 
    margin: auto; 
    background: var(--card-bg); 
    padding: 35px; 
    border-radius: 12px; 
    box-shadow: 0 4px 20px rgba(232, 90, 36, 0.08); 
  }

  h3 {
    color: var(--secondary);
    margin-top: 0;
    font-size: 1.8rem;
    border-bottom: 2px solid var(--primary-light);
    padding-bottom: 10px;
  }

  p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .config-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    background: var(--primary-light); 
    padding: 15px 20px; 
    border-radius: 8px; 
    margin-bottom: 25px; 
    border-left: 4px solid var(--primary);
  }

  .config-group {
    display: flex; 
    align-items: center; 
    gap: 10px;
  }

  label {
    font-weight: 600;
    color: var(--secondary);
  }

  select, .harmonic-input { 
    padding: 8px 12px; 
    font-size: 0.95em; 
    border-radius: 6px; 
    border: 1px solid var(--primary); 
    background: white;
    outline: none;
    cursor: pointer;
  }

  .harmonic-input {
    width: 70px;
    text-align: center;
    cursor: text;
  }

  .table-container {
    overflow-x: auto;
    margin: 20px 0;
  }

  table { 
    border-collapse: collapse; 
    width: 100%; 
    background: white;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td { 
    border: 1px solid var(--border); 
    padding: 10px 12px; 
    text-align: center; 
    font-size: 0.9rem;
  }

  th { 
    background-color: var(--primary); 
    color: white; 
    font-weight: 600;
    white-space: nowrap;
  }

  .sum-row { 
    font-weight: bold; 
    background-color: #f8f9fa; 
    border-top: 2px solid var(--primary);
  }

  input[type="number"] { 
    width: 90px; 
    padding: 6px; 
    text-align: center; 
    border: 1px solid #ccc; 
    border-radius: 6px; 
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--primary);
    outline: none;
  }

  input:disabled { 
    background-color: #f1f3f5; 
    color: var(--text-muted); 
    border: 1px solid #dee2e6; 
    cursor: not-allowed; 
  }

  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  button { 
    padding: 12px 20px; 
    color: white; 
    border: none; 
    cursor: pointer; 
    border-radius: 6px; 
    font-weight: bold; 
    font-size: 0.95rem;
    transition: background 0.2s, transform 0.1s;
  }

  button:active {
    transform: scale(0.98);
  }

  .btn-add { 
    background: var(--secondary); 
  }
  .btn-add:hover {
    background: #003644;
  }

  .btn-calc { 
    background: var(--primary); 
  }
  .btn-calc:hover {
    background: var(--primary-hover);
  }

  .section-title {
    display: block;
    font-size: 1.25rem;
    color: var(--secondary);
    font-weight: bold;
    margin-top: 30px;
    margin-bottom: 10px;
  }

  .result { 
    margin-top: 25px; 
    padding: 20px; 
    background: var(--success-bg); 
    border-left: 5px solid var(--success-border); 
    border-radius: 0 8px 8px 0;
    color: #1b5e20; 
  }

  .steps-box { 
    margin-top: 25px; 
    padding: 25px; 
    background: #fffdfb; 
    border: 1px solid #f6e6dc; 
    border-radius: 8px; 
  }

  .step-title { 
    font-weight: bold; 
    color: var(--primary); 
    margin-top: 20px; 
    margin-bottom: 5px; 
    font-size: 1.05rem;
  }

  .formula { 
    font-family: 'Courier New', Courier, monospace; 
    background: var(--primary-light); 
    padding: 8px 12px; 
    display: inline-block; 
    border-radius: 6px; 
    border: 1px solid #fcdcd0; 
    margin: 8px 0; 
    color: #c44111;
    font-weight: bold;
  }
  
  code {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1rem;
    background: #f1f3f5;
    padding: 4px 8px;
    border-radius: 4px;
    display: block;
    margin-top: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <h3>Harmonic Analysis Calculator</h3>
  <p>Configure framework options, input data targets, set your custom series order capacity, and calculate the matching multi-term Fourier sequence.</p>
  
  <div class="config-grid">
    <div class="config-group">
      <label for="inputMode">X-Axis Metric:</label>
      <select id="inputMode" onchange="toggleInputMode()">
        <option value="index">Continuous Fixed Intervals (Index Slots)</option>
        <option value="degree">Independent Angles (Degrees °)</option>
      </select>
    </div>
    
    <div class="config-group">
      <label for="harmonicCount">Target Number of Harmonics to Compute:</label>
      <input type="number" id="harmonicCount" class="harmonic-input" value="3" min="1" step="1">
    </div>
  </div>
  
  <div class="table-container">
    <table id="inputTable">
      <thead>
        <tr>
          <th id="xHeader" style="width: 50%;">x (index)</th>
          <th style="width: 50%;">y (value)</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="data-row"><td><input type="number" class="x-input" value="0" disabled></td><td><input type="number" class="y-val" value="1.0"></td></tr>
        <tr class="data-row"><td><input type="number" class="x-input" value="1" disabled></td><td><input type="number" class="y-val" value="2.4"></td></tr>
        <tr class="data-row"><td><input type="number" class="x-input" value="2" disabled></td><td><input type="number" class="y-val" value="1.7"></td></tr>
        <tr class="data-row"><td><input type="number" class="x-input" value="3" disabled></td><td><input type="number" class="y-val" value="0.5"></td></tr>
        <tr class="data-row"><td><input type="number" class="x-input" value="4" disabled></td><td><input type="number" class="y-val" value="1.2"></td></tr>
        <tr class="data-row"><td><input type="number" class="x-input" value="5" disabled></td><td><input type="number" class="y-val" value="2.1"></td></tr>
      </tbody>
    </table>
  </div>
  
  <div class="actions">
    <button class="btn-add" onclick="addRow()">Add New Coordinate Pair</button>
    <button class="btn-calc" onclick="calculate()">Compute Analytical Steps</button>
  </div>
  
  <div id="stepContainer"></div>
  <div id="breakdownContainer"></div>
  <div id="finalResult"></div>
</div>

<script>
function toggleInputMode() {
  const mode = document.getElementById('inputMode').value;
  const xHeader = document.getElementById('xHeader');
  const xInputs = document.querySelectorAll('.x-input');
  
  if (mode === 'index') {
    xHeader.innerText = 'x (index)';
    xInputs.forEach((input, index) => {
      input.value = index;
      input.disabled = true;
    });
  } else {
    xHeader.innerText = 'x (Degrees °)';
    xInputs.forEach((input, index) => {
      input.value = index * 60; 
      input.disabled = false;
    });
  }
}

function addRow() {
  const tableBody = document.getElementById('tableBody');
  const rows = tableBody.querySelectorAll('.data-row');
  const mode = document.getElementById('inputMode').value;
  
  let nextXValue = 0;
  let isRowDisabled = "";

  if (mode === 'index') {
    nextXValue = rows.length;
    isRowDisabled = "disabled";
  } else {
    if (rows.length > 0) {
      const lastX = parseFloat(rows[rows.length - 1].querySelector('.x-input').value) || 0;
      const prevX = rows.length > 1 ? parseFloat(rows[rows.length - 2].querySelector('.x-input').value) || 0 : 0;
      const diff = lastX - prevX;
      nextXValue = lastX + (diff > 0 ? diff : 60);
    }
  }

  const row = document.createElement('tr');
  row.className = 'data-row';
  row.innerHTML = `
    <td><input type="number" class="x-input" value="${nextXValue}" ${isRowDisabled}></td>
    <td><input type="number" class="y-val" value="0"></td>
  `;
  tableBody.appendChild(row);
}

function calculate() {
  const mode = document.getElementById('inputMode').value;
  let maxH = parseInt(document.getElementById('harmonicCount').value);
  
  // Guard entry validations
  if (isNaN(maxH) || maxH < 1) {
    alert("Please enter a valid number of harmonics (minimum 1).");
    return;
  }

  const xInputs = document.querySelectorAll('.x-input');
  const yInputs = document.querySelectorAll('.y-val');
  
  const xValues = Array.from(xInputs).map(i => parseFloat(i.value) || 0);
  const y = Array.from(yInputs).map(i => parseFloat(i.value) || 0);
  const M = y.length;
  
  if (M === 0) return;

  // Render HTML data matrix table headers dynamically based on chosen target counts
  let html = '<span class="section-title">Step 1: Computed Multi-Harmonic Integration Array</span>';
  html += '<div class="table-container"><table><tr><th>i</th><th>Input x</th><th>&theta;<sub>i</sub> (Rad)</th><th>y<sub>i</sub></th>';
  
  for(let n = 1; n <= maxH; n++) {
    html += `<th>cos(${n}&theta;)</th><th>sin(${n}&theta;)</th><th>y&middot;cos(${n}&theta;)</th><th>y&middot;sin(${n}&theta;)</th>`;
  }
  html += '</tr>';
  
  let sumY = 0;
  let sumCos = Array(maxH + 1).fill(0);
  let sumSin = Array(maxH + 1).fill(0);
  
  for(let i = 0; i < M; i++) {
    let rad = mode === 'index' ? (2 * Math.PI * i) / M : (xValues[i] * Math.PI) / 180;
    sumY += y[i];
    
    let displayX = mode === 'index' ? xValues[i] : `${xValues[i]}°`;
    html += `<tr><td>${i}</td><td>${displayX}</td><td>${rad.toFixed(3)}</td><td>${y[i].toFixed(2)}</td>`;
    
    for(let n = 1; n <= maxH; n++) {
      let cosVal = Math.cos(n * rad);
      let sinVal = Math.sin(n * rad);
      let yCos = y[i] * cosVal;
      let ySin = y[i] * sinVal;
      
      sumCos[n] += yCos;
      sumSin[n] += ySin;
      
      html += `<td>${cosVal.toFixed(2)}</td><td>${sinVal.toFixed(2)}</td><td>${yCos.toFixed(2)}</td><td>${ySin.toFixed(2)}</td>`;
    }
    html += '</tr>';
  }
  
  // Aggregate summation footprint layouts
  html += `<tr class="sum-row"><td>&Sigma;</td><td>-</td><td>-</td><td>${sumY.toFixed(2)}</td>`;
  for(let n = 1; n <= maxH; n++) {
    html += `<td>-</td><td>-</td><td>${sumCos[n].toFixed(2)}</td><td>${sumSin[n].toFixed(2)}</td>`;
  }
  html += '</tr></table></div>';
  document.getElementById('stepContainer').innerHTML = html;
  
  let a0 = sumY / M;          
  
  let breakdownHtml = `
    <div class="steps-box">
      <span class="section-title" style="margin-top:0;">Step 2: Coefficient Algebraic Dispersal</span>
      <p>Target sample balance weight (<strong>M</strong>) = ${M} points.</p>
      
      <div class="step-title">A. Baseline Constant Axis Evaluation (a<sub>0</sub>)</div>
      <div class="formula">a<sub>0</sub> = &Sigma;y / M</div>
      <code>a<sub>0</sub> = ${sumY.toFixed(3)} / ${M} = <strong>${a0.toFixed(3)}</strong></code>
  `;

  let finalFormulaString = `${a0.toFixed(3)}`;
  let varLabel = mode === 'index' ? '&theta;' : 'x';

  // Step loop computations for every single harmonic ordered by user input
  for(let n = 1; n <= maxH; n++) {
    let an = (2 / M) * sumCos[n];
    let bn = (2 / M) * sumSin[n];
    
    breakdownHtml += `
      <div class="step-title">Harmonic Frequency Term Rank [${n}]</div>
      <div class="formula">a<sub>${n}</sub> = (2/M) &middot; &Sigma;(y &middot; cos(${n}&theta;))</div>
      <code>a<sub>${n}</sub> = (2 / ${M}) &middot; (${sumCos[n].toFixed(3)}) = <strong>${an.toFixed(3)}</strong></code>
      
      <div class="formula">b<sub>${n}</sub> = (2/M) &middot; &Sigma;(y &middot; sin(${n}&theta;))</div>
      <code>b<sub>${n}</sub> = (2 / ${M}) &middot; (${sumSin[n].toFixed(3)}) = <strong>${bn.toFixed(3)}</strong></code>
    `;

    let arg = n === 1 ? varLabel : `${n}${varLabel}`;
    finalFormulaString += ` ${an >= 0 ? '+ ' : '- '}${Math.abs(an).toFixed(3)}cos(${arg})`;
    finalFormulaString += ` ${bn >= 0 ? '+ ' : '- '}${Math.abs(bn).toFixed(3)}sin(${arg})`;
  }
  
  breakdownHtml += `</div>`;
  document.getElementById('breakdownContainer').innerHTML = breakdownHtml;
  
  let modelSubtext = mode === 'index' 
    ? `f(i) &approx; a<sub>0</sub> + &Sigma;[a<sub>n</sub>cos(n&theta;) + b<sub>n</sub>sin(n&theta;)] where &theta; = 2&pi;i/M` 
    : `f(x) &approx; a<sub>0</sub> + &Sigma;[a<sub>n</sub>cos(nx) + b<sub>n</sub>sin(nx)] [x in Degrees]`;

  let resultString = `
    <div class="result">
      <strong style="font-size: 1.1rem;">Step 3: Synthesized Fourier Structural Formula (${maxH} Harmonic Terms Ordered)</strong><br>
      <p style="margin: 5px 0 12px 0; color: inherit; opacity: 0.85;">Model Structure: ${modelSubtext}</p>
      <span style="font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 1.25em; letter-spacing: 0.3px; display: block; word-break: break-all;">
        f(${varLabel}) &approx; ${finalFormulaString}
      </span>
    </div>`;
  
  document.getElementById('finalResult').innerHTML = resultString;
}
</script>
</body>
</html>
